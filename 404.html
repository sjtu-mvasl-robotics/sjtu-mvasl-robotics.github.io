<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found</title>
  <script>
    // 检测当前URL路径
    const path = window.location.pathname;
    
    // 处理各种情况的重定向
    if (path.startsWith('/gbc/')) {
      // GBC文档下的页面，重定向到GBC的404页面
      window.location.href = '/gbc/404.html?path=' + encodeURIComponent(path);
    } else {
      // 主站其他页面的404，可以根据需要添加其他项目的重定向
      // 如果没有特殊处理，默认重定向到主页
      window.location.href = '/';
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      line-height: 1.5;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
  </style>
  <meta http-equiv="refresh" content="2;url=/">
</head>
<body>
  <div class="container">
    <h1>Page Not Found</h1>
    <p>Redirecting you to the appropriate page...</p>
    <p>If you are not redirected automatically, <a href="/">click here to go to the homepage</a>.</p>
  </div>
</body>
</html>
